services:
  redis:
    image: redis:7-alpine
    container_name: coderunner-redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: coderunner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: coderunner
      POSTGRES_PASSWORD: coderunner
      POSTGRES_DB: coderunner
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./apps/backend
    container_name: coderunner-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "3000:3000"
    depends_on:
      - redis
      - postgres

  worker:
    build:
      context: ./apps/worker
    container_name: coderunner-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis

  frontend:
    build:
      context: ./apps/frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
    container_name: coderunner-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      - backend

volumes:
  postgres_data:
